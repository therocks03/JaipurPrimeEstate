<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaipur PrimeEstate – Your Trusted Jaipur Real Estate Partner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96A;
      --gold-dark: #A07830;
      --deep: #1A1208;
      --warm: #2C1F0E;
      --cream: #FAF6EE;
      --sand: #F0E8D6;
      --text: #3A2E1E;
      --muted: #7A6A50;
      --white: #FFFFFF;
      --radius: 4px;
    }
    * {margin:0;padding:0;box-sizing:border-box;}
    html {scroll-behavior:smooth;}
    body {font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden;}
    /* ==== TOP BAR ==== */
    .topbar {background:var(--deep);color:#c8b88a;font-size:12px;letter-spacing:1px;text-align:center;padding:8px 20px;}
    .topbar a {color:var(--gold);text-decoration:none;}
    /* ==== NAV ==== */
    nav {position:sticky;top:0;z-index:1000;background:var(--white);border-bottom:1px solid #e8dfc8;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:68px;box-shadow:0 2px 20px rgba(0,0,0,0.06);}
    .nav-logo {display:flex;align-items:center;gap:12px;text-decoration:none;}
    .nav-logo .logo-icon {width:42px;height:42px;background:var(--deep);border-radius:50%;display:flex;align-items:center;justify-content:center;}
    .nav-logo .logo-icon img {width:auto;height:100%;}
    .nav-logo .logo-text strong {display:block;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--deep);letter-spacing:0.5px;}
    .nav-logo .logo-text span {font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
    .nav-links {display:flex;align-items:center;gap:0;list-style:none;}
    .nav-links li a {display:block;padding:24px 16px;font-size:13px;font-weight:500;color:var(--text);text-decoration:none;letter-spacing:0.3px;transition:color .2s;}
    .nav-links li a:hover {color:var(--gold-dark);}
    .nav-cta {background:var(--gold);color:var(--deep)!important;font-weight:600!important;padding:10px 22px!important;border-radius:2px;letter-spacing:0.5px;transition:background .2s!important;}
    .nav-cta:hover {background:var(--gold-dark)!important;color:var(--white)!important;}
    .nav-hamburger {display:none;cursor:pointer;background:none;border:none;padding:6px;z-index:1001;position:relative;}
    .nav-hamburger span {display:block;width:24px;height:2px;background:var(--deep);margin:5px 0;transition:.3s;}
    .nav-hamburger.active span:nth-child(1){transform:rotate(-45deg) translate(-5px,6px);}
    .nav-hamburger.active span:nth-child(2){opacity:0;}
    .nav-hamburger.active span:nth-child(3){transform:rotate(45deg) translate(-5px,-6px);}
    /* ==== HERO ==== */
    .hero {position:relative;height:92vh;min-height:560px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
    .hero-slides {position:absolute;inset:0;}
    .hero-slide {position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;}
    .hero-slide.active {opacity:1;}
    .hero-slide::after {content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,18,8,0.72)0%,rgba(26,18,8,0.4)60%,rgba(26,18,8,0.55)100%);}
    .hero-slide-1 {background-image:url('https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1600&q=80');}
    .hero-slide-2 {background-image:url('https://images.unsplash.com/photo-1582407947304-fd86f028f716?w=1600&q=80');}
    .hero-slide-3 {background-image:url('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1600&q=80');}
    .hero-content {position:relative;z-index:2;text-align:center;padding:0 20px;max-width:820px;}
    .hero-badge {display:inline-block;background:rgba(201,168,76,0.2);border:1px solid var(--gold);color:var(--gold-light);font-size:11px;letter-spacing:3px;text-transform:uppercase;padding:6px 20px;border-radius:1px;margin-bottom:24px;animation:fadeUp .8s ease both;}
    .hero h1 {font-family:'Cormorant Garamond',serif;font-size:clamp(42px,7vw,82px);font-weight:300;color:var(--white);line-height:1.1;margin-bottom:20px;animation:fadeUp .8s .15s ease both;}
    .hero h1 em {font-style:italic;color:var(--gold-light);}
    .hero-sub {font-size:16px;color:rgba(255,255,255,0.78);font-weight:300;margin-bottom:40px;animation:fadeUp .8s .3s ease both;}
    .hero-actions {display:flex;gap:16px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s .45s ease both;}
    .btn-primary {background:var(--gold);color:var(--deep);padding:14px 36px;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:none;cursor:pointer;text-decoration:none;display:inline-block;border-radius:2px;transition:background .25s,transform .2s;}
    .btn-primary:hover {background:var(--gold-dark);color:var(--white);transform:translateY(-1px);}
    .btn-outline {background:transparent;color:var(--white);padding:14px 36px;font-size:13px;font-weight:500;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(255,255,255,0.5);cursor:pointer;text-decoration:none;display:inline-block;border-radius:2px;transition:border-color .25s,background .25s;}
    .btn-outline:hover {border-color:var(--gold);background:rgba(201,168,76,0.12);}
    /* ==== SEARCH BAR ==== */
    .search-section {background:var(--white);padding:24px 40px;box-shadow:0 4px 24px rgba(0,0,0,0.08);}
    .search-form {max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
    .search-form select,.search-form input {flex:1;min-width:160px;padding:12px 16px;border:1px solid #ddd4bc;background:var(--cream);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);border-radius:2px;outline:none;transition:border-color .2s;}
    .search-form select:focus,.search-form input:focus {border-color:var(--gold);}
    .search-form .btn-primary {min-width:140px;padding:12px 24px;}
    /* ==== LISTING VIEW ==== */
    #listingView {display:block;}
    #propertyView {display:none;}
    .listing-wrap {max-width:1160px;margin:0 auto;padding:56px 40px;}
    .listing-grid {display:grid;grid-template-columns:repeat(3,1fr);gap:28px;}
    .property-featured {grid-column:1/-1;display:grid;grid-template-columns:1.4fr 1fr;background:var(--white);overflow:hidden;cursor:pointer;transition:box-shadow .3s;}
    .property-featured:hover {box-shadow:0 20px 60px rgba(0,0,0,0.12);}
    .property-featured:hover .pf-img img {transform:scale(1.04);}
    .pf-img {overflow:hidden;min-height:340px;}
    .pf-img img {width:100%;height:100%;object-fit:cover;transition:transform .6s;display:block;}
    .pf-body {padding:40px;display:flex;flex-direction:column;justify-content:center;}
    .pf-tag {font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-dark);font-weight:700;margin-bottom:12px;}
    .pf-title {font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;color:var(--deep);line-height:1.25;margin-bottom:14px;}
    .pf-excerpt {font-size:14px;color:var(--muted);line-height:1.75;margin-bottom:24px;}
    .pf-meta {display:flex;align-items:center;gap:16px;font-size:12px;color:var(--muted);margin-bottom:20px;flex-wrap:wrap;}
    .view-btn {display:inline-block;background:var(--gold);color:var(--deep);padding:12px 28px;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:none;cursor:pointer;border-radius:2px;transition:.2s;text-decoration:none;width:fit-content;}
    .view-btn:hover {background:var(--gold-dark);color:var(--white);}
    .property-card {background:var(--white);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;}
    .property-card:hover {transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,0.1);}
    .property-card:hover .pc-img img {transform:scale(1.06);}
    .pc-img {height:210px;overflow:hidden;position:relative;}
    .pc-img img {width:100%;height:100%;object-fit:cover;transition:transform .5s;display:block;}
    .pc-tag {position:absolute;bottom:0;left:0;background:var(--gold);color:var(--deep);font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;}
    .pc-body {padding:22px;flex:1;display:flex;flex-direction:column;}
    .pc-title {font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--deep);line-height:1.35;margin-bottom:8px;}
    .pc-location {font-size:12px;color:var(--muted);margin-bottom:10px;}
    .pc-excerpt {font-size:13px;color:var(--muted);line-height:1.7;flex:1;}
    .pc-footer {padding:14px 22px;border-top:1px solid var(--sand);display:flex;align-items:center;justify-content:space-between;}
    .pc-price {font-size:16px;color:var(--gold-dark);font-weight:700;}
    .pc-link {font-size:12px;color:var(--gold-dark);font-weight:700;}
    .empty-properties {text-align:center;padding:80px;grid-column:1/-1;}
    .empty-properties h3 {font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--deep);margin-bottom:10px;}
    .empty-properties p {color:var(--muted);font-size:14px;}
    /* ==== PROPERTY DETAIL PAGE (admin only) ==== */
    .admin-btn {display:none;} /* hidden by default – shown only for admin */
    @media(max-width:900px){
      .listing-grid{grid-template-columns:1fr;}
      .property-featured{grid-template-columns:1fr;}
      .pf-img{min-height:240px;}
      .details-grid{grid-template-columns:1fr;}
      .related-grid{grid-template-columns:1fr;}
    }
    @keyframes fadeUp {from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .6s ease-out forwards;opacity:0;}
  </style>
</head>
<body>
  <!-- NAVIGATION (keep existing) -->
  <nav id="main-nav">
    <a href="#" class="nav-logo">
      <div class="logo-icon"><img src="logo.png" alt="Logo"></div>
      <div class="logo-text"><strong>Jaipur PrimeEstate</strong><span>Real Estate</span></div>
    </a>
    <ul class="nav-links" id="nav-links">
      <li><a href="#hero">Home</a></li>
      <li><a href="#properties">Properties</a></li>
      <li><a href="#contact">Contact</a></li>
      <li class="nav-cta"><a href="#contact">Get Started</a></li>
    </ul>
    <button class="nav-hamburger" id="hamburger"><span></span><span></span><span></span></button>
  </nav>

  <!-- HERO SECTION (keep existing) -->
  <section class="hero" id="hero">
    <div class="hero-slides">
      <div class="hero-slide hero-slide-1 active"></div>
      <div class="hero-slide hero-slide-2"></div>
      <div class="hero-slide hero-slide-3"></div>
    </div>
    <div class="hero-content">
      <div class="hero-badge">Premium Real Estate</div>
      <h1>Find Your <em>Dream Home</em> in Jaipur</h1>
      <p class="hero-sub">Curated listings, transparent pricing, and expert guidance.</p>
      <div class="hero-actions">
        <a href="#properties" class="btn-primary">Explore Listings</a>
        <a href="#contact" class="btn-outline">Contact Us</a>
      </div>
    </div>
    <div class="hero-dots">
      <button class="hero-dot active" data-slide="0"></button>
      <button class="hero-dot" data-slide="1"></button>
      <button class="hero-dot" data-slide="2"></button>
    </div>
  </section>

  <!-- LISTING VIEW -->
  <div id="listingView">
    <div class="listing-wrap">
      <div class="listing-grid" id="listingGrid"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="publish.js"></script>
  <script>
    // ===== HERO SLIDER =====
    let currentSlide = 0;
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.hero-dot');
    function goToSlide(n){
      slides[currentSlide].classList.remove('active');
      dots[currentSlide].classList.remove('active');
      currentSlide = n;
      slides[currentSlide].classList.add('active');
      dots[currentSlide].classList.add('active');
    }
    dots.forEach(dot => dot.addEventListener('click',()=>goToSlide(+dot.dataset.slide)));
    setInterval(()=>goToSlide((currentSlide+1)%slides.length),5000);

    // ===== HAMBURGER =====
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    hamburger.addEventListener('click',()=>{navLinks.classList.toggle('open');hamburger.classList.toggle('active');});
    document.querySelectorAll('.nav-links a').forEach(link=>{link.addEventListener('click',()=>{if(navLinks.classList.contains('open')){navLinks.classList.remove('open');hamburger.classList.remove('active');}});});

    // ===== SCROLL ANIMATIONS =====
    const fadeEls = document.querySelectorAll('.fade-in');
    const observer = new IntersectionObserver((entries)=>{entries.forEach((e,i)=>{if(e.isIntersecting){setTimeout(()=>e.target.classList.add('visible'),i*60);observer.unobserve(e.target);}});},{threshold:0.12});
    fadeEls.forEach(el=>observer.observe(el));

    // ===== ADMIN VISIBILITY (admin=1 query param) =====
    const urlParams = new URLSearchParams(window.location.search);
    const IS_ADMIN = urlParams.has('admin') && urlParams.get('admin') === '1';
    document.addEventListener('DOMContentLoaded',()=>{if(IS_ADMIN){document.querySelectorAll('.admin-btn').forEach(btn=>btn.style.display='inline-block');}});
  </script>
</body>
</html>
